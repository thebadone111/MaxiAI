<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/maxi-mark.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1C1A2E" />
    <meta name="description" content="Maxi AI Development Ltd — software and AI infrastructure for businesses that intend to stay. London." />
    <title>Maxi AI Development — Software & AI infrastructure</title>
    <script>
      /*
        Runs before first paint. `js` lets CSS hide what scroll reveals will
        show (without JavaScript nothing would ever un-hide). `intro-pending`
        covers the prerendered page with the intro's ink ground until the
        intro mounts, so the page never flashes first.

        It plays when a visitor arrives from outside the site: not on a
        reload, not on back/forward, not when following an internal link.
        Nothing is stored on the visitor's device to decide this (the privacy
        notice promises no cookies and no local or session storage).
        ?intro replays it; ?intro=off skips it.

        Failsafe: if the intro has not mounted within 4s (bundle failed to
        load), uncover the page. CSS has a second, script-free failsafe.
      */
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        var show;
        try {
          var q = new URLSearchParams(location.search);
          var v = q.has('intro') ? (q.get('intro') || 'on') : null;
          var nav = performance.getEntriesByType('navigation')[0];
          var fresh = !nav || nav.type === 'navigate';
          var internal = !!document.referrer && new URL(document.referrer).host === location.host;
          show = v === 'off' ? false : v ? true : fresh && !internal;
        } catch (e) { show = false; }
        if (!show) return;
        d.classList.add('intro-pending');
        setTimeout(function () {
          if (!document.querySelector('[data-intro]')) d.classList.remove('intro-pending');
        }, 4000);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
